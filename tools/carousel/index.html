<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Carousel preview — Offerloop Ad Studio</title>
<style>
  :root {
    --bg: #101114;
    --panel: #191b20;
    --panel-2: #202329;
    --line: #2c3038;
    --text: #eceef2;
    --muted: #9aa1ad;
    --primary: #4a60a8;
    --primary-light: #b6c3e8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  header .spacer { flex: 1; }
  select, button {
    font: inherit;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 10px;
    cursor: pointer;
  }
  button:hover, select:hover { border-color: #3c424d; }
  button.on { background: var(--primary); border-color: var(--primary); }
  .hint { color: var(--muted); font-size: 12px; }

  main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 380px;
    gap: 28px;
    padding: 28px;
    align-items: start;
    max-width: 1500px;
    margin: 0 auto;
  }
  @media (max-width: 1100px) { main { grid-template-columns: minmax(0, 1fr); } }

  /* ---- Phone / feed simulation ---- */
  .stage { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .phone {
    width: 430px;
    max-width: 100%;
    background: #000;
    border: 1px solid var(--line);
    border-radius: 22px;
    overflow: hidden;
  }
  .post-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    color: #fff;
    font-size: 13px;
  }
  .avatar {
    width: 30px; height: 30px; border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    display: grid; place-items: center;
    font-size: 13px; font-weight: 700; color: #fff;
  }
  .handle { font-weight: 600; }

  .frame { position: relative; background: #000; aspect-ratio: 4 / 5; }
  .frame img {
    width: 100%; height: 100%;
    object-fit: contain;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
  }
  .counter {
    position: absolute; top: 10px; right: 10px;
    background: rgba(0,0,0,.6); color: #fff;
    font-size: 12px; font-weight: 600;
    padding: 3px 9px; border-radius: 12px;
  }
  .nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 30px; height: 30px; border-radius: 50%;
    background: rgba(255,255,255,.9); color: #111;
    border: 0; display: grid; place-items: center;
    font-size: 15px; line-height: 1; padding: 0;
    opacity: 0; transition: opacity .12s;
  }
  .frame:hover .nav { opacity: 1; }
  .nav:disabled { opacity: 0 !important; }
  .nav.prev { left: 8px; }
  .nav.next { right: 8px; }

  .post-foot { padding: 10px 12px 14px; color: #fff; }
  .dots { display: flex; gap: 5px; justify-content: center; padding: 10px 0 12px; }
  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #3a3d44; border: 0; padding: 0; cursor: pointer;
  }
  .dot.on { background: #2f7ef5; }
  .caption-feed { font-size: 13px; line-height: 1.45; white-space: pre-wrap; }
  .caption-feed .name { font-weight: 600; margin-right: 6px; }

  /* ---- Grid mode ---- */
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    width: 100%;
  }
  @media (max-width: 1400px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 800px)  { .grid { grid-template-columns: repeat(2, 1fr); } }
  .cell {
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    background: var(--panel);
    cursor: pointer;
  }
  .cell.on { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
  .cell img { width: 100%; display: block; aspect-ratio: 4/5; object-fit: contain; background: #000; }
  .cell .meta {
    display: flex; justify-content: space-between; gap: 8px;
    padding: 7px 9px; font-size: 11px; color: var(--muted);
  }

  /* ---- Side panel ---- */
  .side { display: flex; flex-direction: column; gap: 18px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
  }
  .card h2 {
    margin: 0 0 10px;
    font-size: 11px; font-weight: 600;
    letter-spacing: .09em; text-transform: uppercase;
    color: var(--muted);
  }
  .card pre {
    margin: 0;
    white-space: pre-wrap;
    font: inherit;
    color: var(--text);
  }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13px; }
  dt { color: var(--muted); }
  dd { margin: 0; }
  .slide-list { display: flex; flex-direction: column; gap: 2px; }
  .slide-list button {
    text-align: left; background: none; border: 0; border-radius: 6px;
    padding: 6px 8px; color: var(--muted); font-size: 13px; width: 100%;
  }
  .slide-list button:hover { background: var(--panel-2); color: var(--text); }
  .slide-list button.on { background: var(--panel-2); color: var(--text); font-weight: 600; }
  .slide-list .n { color: #666e7c; margin-right: 8px; font-variant-numeric: tabular-nums; }
  .path { font-size: 11px; color: #666e7c; word-break: break-all; }
</style>
</head>
<body>

<header>
  <h1>Carousel preview</h1>
  <select id="pick"></select>
  <div class="spacer"></div>
  <button id="modeFeed" class="on">Feed</button>
  <button id="modeGrid">Grid</button>
  <span class="hint">← → to swipe</span>
</header>

<main>
  <section class="stage" id="stage"></section>
  <aside class="side" id="side"></aside>
</main>

<script>
const state = {decks: [], deck: null, i: 0, mode: 'feed'};

const el = (tag, attrs = {}, kids = []) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const kid of [].concat(kids)) if (kid) n.append(kid);
  return n;
};

const go = (i) => {
  const n = state.deck.slides.length;
  state.i = Math.max(0, Math.min(n - 1, i));
  render();
};

function renderFeed(stage) {
  const d = state.deck;
  const slide = d.slides[state.i];

  const frame = el('div', {class: 'frame'}, [
    el('img', {src: slide.url, alt: slide.label}),
    el('div', {class: 'counter', text: `${state.i + 1}/${d.slides.length}`}),
  ]);
  const prev = el('button', {class: 'nav prev', text: '‹', onclick: () => go(state.i - 1)});
  const next = el('button', {class: 'nav next', text: '›', onclick: () => go(state.i + 1)});
  prev.disabled = state.i === 0;
  next.disabled = state.i === d.slides.length - 1;
  frame.append(prev, next);

  const dots = el('div', {class: 'dots'},
    d.slides.map((_, i) => el('button', {
      class: 'dot' + (i === state.i ? ' on' : ''),
      onclick: () => go(i),
    })));

  // First block of caption.txt is the live caption; anything after a `---`
  // rule is an alternate take, kept in the side panel instead.
  const primary = (d.caption.split(/^---$/m)[0] || '').trim();

  stage.append(el('div', {class: 'phone'}, [
    el('div', {class: 'post-head'}, [
      el('div', {class: 'avatar', text: 'O'}),
      el('div', {class: 'handle', text: 'offerloop.ai'}),
    ]),
    frame,
    dots,
    el('div', {class: 'post-foot'}, [
      el('div', {class: 'caption-feed'}, [
        el('span', {class: 'name', text: 'offerloop.ai'}),
        document.createTextNode(primary),
      ]),
    ]),
  ]));
}

function renderGrid(stage) {
  const d = state.deck;
  stage.append(el('div', {class: 'grid'}, d.slides.map((s, i) =>
    el('div', {
      class: 'cell' + (i === state.i ? ' on' : ''),
      onclick: () => { state.i = i; state.mode = 'feed'; render(); },
    }, [
      el('img', {src: s.url, alt: s.label, loading: 'lazy'}),
      el('div', {class: 'meta'}, [
        el('span', {text: String(i + 1).padStart(2, '0')}),
        el('span', {text: s.label}),
      ]),
    ])
  )));
}

function renderSide(side) {
  const d = state.deck;
  const slide = d.slides[state.i];
  const alt = d.caption.split(/^---$/m).slice(1).join('---').trim();

  side.append(el('div', {class: 'card'}, [
    el('h2', {text: 'Slide'}),
    el('dl', {}, [
      el('dt', {text: 'Position'}), el('dd', {text: `${state.i + 1} of ${d.slides.length}`}),
      el('dt', {text: 'File'}), el('dd', {text: slide.file}),
    ]),
    el('div', {class: 'path', text: `public/assets/carousels/${d.name}/${slide.file}`}),
  ]));

  side.append(el('div', {class: 'card'}, [
    el('h2', {text: 'Slides'}),
    el('div', {class: 'slide-list'}, d.slides.map((s, i) =>
      el('button', {class: i === state.i ? 'on' : '', onclick: () => go(i)}, [
        el('span', {class: 'n', text: String(i + 1).padStart(2, '0')}),
        document.createTextNode(s.label),
      ])
    )),
  ]));

  if (alt) {
    side.append(el('div', {class: 'card'}, [
      el('h2', {text: 'Alternate caption'}),
      el('pre', {text: alt}),
    ]));
  }

  if (d.contactSheet) {
    side.append(el('div', {class: 'card'}, [
      el('h2', {text: 'Contact sheet'}),
      el('a', {href: d.contactSheet, target: '_blank'}, [
        el('img', {src: d.contactSheet, style: 'width:100%;border-radius:6px;display:block'}),
      ]),
    ]));
  }
}

function render() {
  const stage = document.getElementById('stage');
  const side = document.getElementById('side');
  stage.replaceChildren();
  side.replaceChildren();
  if (!state.deck) {
    stage.append(el('div', {class: 'hint', text: 'No carousels found in public/assets/carousels/'}));
    return;
  }
  state.mode === 'grid' ? renderGrid(stage) : renderFeed(stage);
  renderSide(side);
  document.getElementById('modeFeed').className = state.mode === 'feed' ? 'on' : '';
  document.getElementById('modeGrid').className = state.mode === 'grid' ? 'on' : '';
}

document.getElementById('modeFeed').onclick = () => { state.mode = 'feed'; render(); };
document.getElementById('modeGrid').onclick = () => { state.mode = 'grid'; render(); };

addEventListener('keydown', (e) => {
  if (!state.deck) return;
  if (e.key === 'ArrowRight') go(state.i + 1);
  if (e.key === 'ArrowLeft') go(state.i - 1);
  if (e.key === 'g') { state.mode = state.mode === 'grid' ? 'feed' : 'grid'; render(); }
});

(async () => {
  const {carousels} = await (await fetch('/api/carousels')).json();
  state.decks = carousels;
  state.deck = carousels[0] ?? null;
  const pick = document.getElementById('pick');
  pick.replaceChildren(...carousels.map((c) =>
    el('option', {value: c.name, text: `${c.name} · ${c.slides.length} slides`})));
  pick.onchange = () => {
    state.deck = state.decks.find((c) => c.name === pick.value);
    state.i = 0;
    render();
  };
  render();
})();
</script>
</body>
</html>
