<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Offerloop Storyboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #F5F6F8;
    --primary: #4A60A8;
    --primary-600: #3D4F89;
    --secondary-light: #B6C3E8;
    --secondary-dark: #1E2D4D;
    --ink: #112F54;
    --card: #FFFFFF;
    --line: #E3E5EC;
    --muted: #6C7FBA;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg);
    color: var(--secondary-dark);
    font-family: 'Inter', -apple-system, sans-serif;
    font-size: 14px;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 16px;
    padding: 14px 24px;
    background: #fff; border-bottom: 1px solid var(--line);
  }
  header h1 { font-family: 'Lora', Georgia, serif; font-size: 20px; color: var(--ink); }
  header h1 span { color: var(--primary); }
  select, input, textarea, button {
    font-family: inherit; font-size: 13px; color: var(--secondary-dark);
  }
  select {
    padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff;
    min-width: 180px;
  }
  .btn {
    padding: 7px 14px; border: 1px solid var(--line); border-radius: 8px;
    background: #fff; cursor: pointer; font-weight: 500;
  }
  .btn:hover { border-color: var(--secondary-light); background: #FAFBFD; }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.primary:hover { background: var(--primary-600); }
  .btn.danger:hover { border-color: #d88; color: #b33; }
  .spacer { flex: 1; }
  #status { font-size: 12px; color: var(--muted); min-width: 70px; text-align: right; }
  #total { font-size: 12px; color: var(--muted); }

  main { padding: 24px; }
  #empty {
    max-width: 460px; margin: 80px auto; text-align: center; color: var(--muted);
  }
  #empty h2 { font-family: 'Lora', Georgia, serif; color: var(--ink); margin-bottom: 8px; }

  #board {
    display: grid; gap: 18px;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    align-items: start;
  }
  .scene {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    overflow: hidden; box-shadow: 0 1px 3px rgba(17,47,84,.06);
  }
  .scene-head {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; background: #FAFBFD; border-bottom: 1px solid var(--line);
  }
  .scene-num {
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--primary); color: #fff;
    display: grid; place-items: center; font-size: 12px; font-weight: 600; flex: none;
  }
  .scene-head input.title {
    flex: 1; border: none; background: transparent; font-weight: 600; font-size: 14px;
    outline: none; min-width: 0;
  }
  .icon-btn {
    border: none; background: transparent; cursor: pointer; color: var(--muted);
    font-size: 14px; padding: 2px 4px; border-radius: 6px; flex: none;
  }
  .icon-btn:hover { background: var(--line); color: var(--secondary-dark); }

  .thumb {
    position: relative; aspect-ratio: 16/9; background: var(--secondary-dark);
    cursor: pointer; display: grid; place-items: center; color: var(--secondary-light);
  }
  .thumb video, .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .placeholder { font-size: 13px; }
  .thumb .asset-name {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 4px 8px; font-size: 11px; color: #fff;
    background: linear-gradient(transparent, rgba(17,47,84,.85));
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .thumb .kind-badge {
    position: absolute; top: 8px; left: 8px; padding: 2px 8px; border-radius: 20px;
    font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px;
    background: rgba(255,255,255,.9); color: var(--primary);
  }

  .scene-body { padding: 10px 12px; display: grid; gap: 8px; }
  .scene-body label {
    font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .6px;
    color: var(--muted); display: block; margin-bottom: 2px;
  }
  .scene-body textarea, .scene-body input[type=number] {
    width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px;
    resize: vertical; background: #FAFBFD; outline: none;
  }
  .scene-body textarea:focus, .scene-body input:focus { border-color: var(--secondary-light); }
  .row2 { display: grid; grid-template-columns: 1fr 90px; gap: 8px; }

  #addScene {
    min-height: 220px; border: 2px dashed var(--secondary-light); border-radius: 14px;
    background: transparent; color: var(--primary); font-size: 15px; font-weight: 600;
    cursor: pointer;
  }
  #addScene:hover { background: #EDF0F8; }

  /* Asset picker modal */
  #picker {
    position: fixed; inset: 0; background: rgba(17,47,84,.45); z-index: 50;
    display: none; place-items: center;
  }
  #picker.open { display: grid; }
  .picker-panel {
    background: #fff; border-radius: 16px; width: min(920px, 92vw); height: min(640px, 88vh);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .picker-head { display: flex; gap: 12px; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .picker-head input {
    flex: 1; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; outline: none;
  }
  .picker-grid {
    overflow-y: auto; padding: 16px; display: grid; gap: 12px;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    align-content: start; flex: 1;
  }
  .picker-item {
    border: 1px solid var(--line); border-radius: 10px; overflow: hidden; cursor: pointer;
    background: #fff;
  }
  .picker-item:hover { border-color: var(--primary); box-shadow: 0 2px 8px rgba(74,96,168,.18); }
  .picker-item .pi-thumb { aspect-ratio: 16/9; background: var(--secondary-dark); position: relative; }
  .picker-item .pi-thumb video, .picker-item .pi-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .picker-item .pi-thumb .dur {
    position: absolute; bottom: 6px; right: 6px; background: rgba(17,47,84,.8); color: #fff;
    font-size: 10px; padding: 1px 6px; border-radius: 4px;
  }
  .picker-item .pi-meta { padding: 8px 10px; }
  .picker-item .pi-name { font-size: 12px; font-weight: 600; word-break: break-all; }
  .picker-item .pi-desc {
    font-size: 11px; color: var(--muted); margin-top: 3px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
</style>
</head>
<body>

<header>
  <h1>Offerloop <span>Storyboard</span></h1>
  <select id="boardSelect"></select>
  <button class="btn" id="newBoard">+ New board</button>
  <button class="btn danger" id="deleteBoard">Delete</button>
  <div class="spacer"></div>
  <div id="total"></div>
  <div id="status"></div>
</header>

<main>
  <div id="empty" hidden>
    <h2>No storyboards yet</h2>
    <p>Create a board to start planning scenes. Boards save automatically to <code>plans/storyboards/</code>.</p>
    <p style="margin-top:16px"><button class="btn primary" id="emptyNew">+ New board</button></p>
  </div>
  <div id="board"></div>
</main>

<div id="picker">
  <div class="picker-panel">
    <div class="picker-head">
      <input id="pickerSearch" placeholder="Search assets… (filename or description)" />
      <button class="btn" id="pickerClear">No asset</button>
      <button class="btn" id="pickerClose">Close</button>
    </div>
    <div class="picker-grid" id="pickerGrid"></div>
  </div>
</div>

<script>
const $ = (sel) => document.querySelector(sel);
let manifest = [];
let boards = [];          // [{name, updatedAt, scenes:[...]}]
let current = null;       // current board object
let pickerSceneId = null; // scene whose asset is being picked
let saveTimer = null;

const uid = () => Math.random().toString(36).slice(2, 9);
const fmtDur = (s) => (s == null || s === '' ? '' : `${Number(s).toFixed(1)}s`);

const newScene = () => ({
  id: uid(), title: '', asset: null, description: '', vo: '', durationSec: '', notes: '',
});

// ---------- persistence ----------
async function loadAll() {
  const [m, b] = await Promise.all([
    fetch('/api/manifest').then((r) => r.json()),
    fetch('/api/boards').then((r) => r.json()),
  ]);
  manifest = m.assets ?? [];
  boards = b;
  current = boards[0] ?? null;
  renderBoardSelect();
  renderBoard();
}

function scheduleSave() {
  if (!current) return;
  $('#status').textContent = 'Saving…';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    const res = await fetch(`/api/boards/${current.name}`, {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(current),
    });
    $('#status').textContent = res.ok ? 'Saved ✓' : 'Save failed';
  }, 600);
}

// ---------- rendering ----------
function renderBoardSelect() {
  const sel = $('#boardSelect');
  sel.innerHTML = '';
  for (const b of boards) {
    const opt = document.createElement('option');
    opt.value = b.name;
    opt.textContent = b.name;
    if (current && b.name === current.name) opt.selected = true;
    sel.appendChild(opt);
  }
  sel.hidden = $('#deleteBoard').hidden = boards.length === 0;
}

function assetByFile(filename) {
  return manifest.find((a) => a.filename === filename) ?? null;
}

function thumbInner(asset) {
  if (!asset) return '<div class="placeholder">＋ pick asset</div>';
  const url = '/' + asset.filename;
  const isVideo = /\.(mp4|mov|webm)$/i.test(asset.filename);
  const isAudio = /\.(mp3|wav)$/i.test(asset.filename);
  const media = isVideo
    ? `<video src="${url}" muted preload="metadata"></video>`
    : isAudio
    ? `<div class="placeholder">🔊 audio</div>`
    : `<img src="${url}" loading="lazy" />`;
  const shortName = asset.filename.split('/').pop();
  return `${media}<span class="kind-badge">${asset.kind ?? ''}</span><span class="asset-name">${shortName}</span>`;
}

function renderBoard() {
  const board = $('#board');
  const empty = $('#empty');
  board.innerHTML = '';
  if (!current) {
    empty.hidden = false;
    $('#total').textContent = '';
    return;
  }
  empty.hidden = true;

  current.scenes.forEach((scene, i) => {
    const card = document.createElement('div');
    card.className = 'scene';
    card.innerHTML = `
      <div class="scene-head">
        <div class="scene-num">${i + 1}</div>
        <input class="title" placeholder="Scene title" value="${escapeAttr(scene.title)}" />
        <button class="icon-btn" data-act="left" title="Move left">◀</button>
        <button class="icon-btn" data-act="right" title="Move right">▶</button>
        <button class="icon-btn" data-act="dup" title="Duplicate">⧉</button>
        <button class="icon-btn" data-act="del" title="Delete">✕</button>
      </div>
      <div class="thumb" title="${escapeAttr(assetByFile(scene.asset)?.description ?? 'Click to pick an asset')}">
        ${thumbInner(assetByFile(scene.asset))}
      </div>
      <div class="scene-body">
        <div>
          <label>Action / description</label>
          <textarea rows="2" data-field="description" placeholder="What happens on screen">${escapeHtml(scene.description)}</textarea>
        </div>
        <div class="row2">
          <div>
            <label>Voiceover / caption</label>
            <textarea rows="2" data-field="vo" placeholder="VO line or on-screen text">${escapeHtml(scene.vo)}</textarea>
          </div>
          <div>
            <label>Duration (s)</label>
            <input type="number" min="0" step="0.5" data-field="durationSec" value="${escapeAttr(scene.durationSec)}" />
          </div>
        </div>
        <div>
          <label>Notes</label>
          <textarea rows="1" data-field="notes" placeholder="Transitions, music, todos…">${escapeHtml(scene.notes)}</textarea>
        </div>
      </div>`;

    card.querySelector('.title').addEventListener('input', (e) => {
      scene.title = e.target.value; scheduleSave();
    });
    card.querySelectorAll('[data-field]').forEach((el) => {
      el.addEventListener('input', () => { scene[el.dataset.field] = el.value; scheduleSave(); updateTotal(); });
    });
    card.querySelector('.thumb').addEventListener('click', () => openPicker(scene.id));
    card.querySelectorAll('[data-act]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const idx = current.scenes.indexOf(scene);
        const act = btn.dataset.act;
        if (act === 'del') current.scenes.splice(idx, 1);
        if (act === 'dup') current.scenes.splice(idx + 1, 0, {...scene, id: uid()});
        if (act === 'left' && idx > 0) [current.scenes[idx - 1], current.scenes[idx]] = [scene, current.scenes[idx - 1]];
        if (act === 'right' && idx < current.scenes.length - 1) [current.scenes[idx + 1], current.scenes[idx]] = [scene, current.scenes[idx + 1]];
        scheduleSave();
        renderBoard();
      });
    });

    board.appendChild(card);
  });

  const add = document.createElement('button');
  add.id = 'addScene';
  add.textContent = '+ Add scene';
  add.addEventListener('click', () => {
    current.scenes.push(newScene());
    scheduleSave();
    renderBoard();
  });
  board.appendChild(add);
  updateTotal();
}

function updateTotal() {
  if (!current) return;
  const total = current.scenes.reduce((s, sc) => s + (Number(sc.durationSec) || 0), 0);
  $('#total').textContent = `${current.scenes.length} scenes · ${total.toFixed(1)}s total`;
}

const escapeHtml = (s) => String(s ?? '').replace(/[&<>]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const escapeAttr = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- asset picker ----------
function openPicker(sceneId) {
  pickerSceneId = sceneId;
  $('#pickerSearch').value = '';
  renderPickerGrid('');
  $('#picker').classList.add('open');
  $('#pickerSearch').focus();
}

function renderPickerGrid(query) {
  const q = query.toLowerCase();
  const grid = $('#pickerGrid');
  grid.innerHTML = '';
  manifest
    .filter((a) => !q || a.filename.toLowerCase().includes(q) || (a.description ?? '').toLowerCase().includes(q))
    .forEach((a) => {
      const item = document.createElement('div');
      item.className = 'picker-item';
      const url = '/' + a.filename;
      const isVideo = /\.(mp4|mov|webm)$/i.test(a.filename);
      const isAudio = /\.(mp3|wav)$/i.test(a.filename);
      const media = isVideo
        ? `<video src="${url}" muted preload="metadata"></video>`
        : isAudio
        ? `<div style="display:grid;place-items:center;height:100%;color:#B6C3E8">🔊 audio</div>`
        : `<img src="${url}" loading="lazy" />`;
      item.innerHTML = `
        <div class="pi-thumb">${media}${a.duration ? `<span class="dur">${fmtDur(a.duration)}</span>` : ''}</div>
        <div class="pi-meta">
          <div class="pi-name">${a.filename.split('/').pop()}</div>
          <div class="pi-desc">${escapeHtml(a.description ?? '')}</div>
        </div>`;
      if (isVideo) {
        const v = item.querySelector('video');
        item.addEventListener('mouseenter', () => v.play().catch(() => {}));
        item.addEventListener('mouseleave', () => { v.pause(); v.currentTime = 0; });
      }
      item.addEventListener('click', () => {
        const scene = current.scenes.find((s) => s.id === pickerSceneId);
        if (scene) {
          scene.asset = a.filename;
          if (!scene.durationSec && a.duration) scene.durationSec = Math.round(a.duration * 2) / 2;
          scheduleSave();
        }
        closePicker();
        renderBoard();
      });
      grid.appendChild(item);
    });
}

function closePicker() {
  $('#picker').classList.remove('open');
  pickerSceneId = null;
}

$('#pickerSearch').addEventListener('input', (e) => renderPickerGrid(e.target.value));
$('#pickerClose').addEventListener('click', closePicker);
$('#pickerClear').addEventListener('click', () => {
  const scene = current?.scenes.find((s) => s.id === pickerSceneId);
  if (scene) { scene.asset = null; scheduleSave(); }
  closePicker();
  renderBoard();
});
$('#picker').addEventListener('click', (e) => { if (e.target.id === 'picker') closePicker(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePicker(); });

// ---------- board management ----------
async function createBoard() {
  const raw = prompt('Board name (kebab-case, e.g. meta-ad-v1):');
  if (!raw) return;
  const name = raw.trim().toLowerCase().replace(/[^a-z0-9-]+/g, '-').replace(/^-+|-+$/g, '');
  if (!name) return alert('Invalid name');
  if (boards.some((b) => b.name === name)) return alert('A board with that name already exists');
  const board = {name, scenes: [newScene()]};
  boards.unshift(board);
  current = board;
  await fetch(`/api/boards/${name}`, {
    method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(board),
  });
  renderBoardSelect();
  renderBoard();
}

$('#newBoard').addEventListener('click', createBoard);
$('#emptyNew').addEventListener('click', createBoard);

$('#boardSelect').addEventListener('change', (e) => {
  current = boards.find((b) => b.name === e.target.value) ?? null;
  renderBoard();
});

$('#deleteBoard').addEventListener('click', async () => {
  if (!current) return;
  if (!confirm(`Delete board "${current.name}"? The JSON file will be removed.`)) return;
  await fetch(`/api/boards/${current.name}`, {method: 'DELETE'});
  boards = boards.filter((b) => b !== current);
  current = boards[0] ?? null;
  renderBoardSelect();
  renderBoard();
});

loadAll();
</script>
</body>
</html>
